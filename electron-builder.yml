appId: com.vip3rousmango.cssourcemodmanager
productName: Counter-Strike Source Mod Manager
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
compression: maximum
asar: true
directories:
  output: release
files:
  - .vite/build/**/*
  - .vite/renderer/**/*
  - catalog/**/*
  - package.json
extraMetadata:
  main: .vite/build/index.js
linux:
  executableName: cs-source-mod-manager
  maintainer: vip3rousmango <vip3rousmango@users.noreply.github.com>
  syncDesktopName: true
  category: Game
  target:
    - AppImage
    - deb
win:
  executableName: cs-source-mod-manager
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  category: public.app-category.games
  target:
    - dmg
    - zip
publish:
  provider: github
  owner: vip3rousmango
  repo: cs-source-mod-manager
