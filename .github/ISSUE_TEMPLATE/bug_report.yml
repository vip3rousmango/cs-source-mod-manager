name: Bug report
description: Report a reproducible problem with the mod manager
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Use this form for one reproducible product problem. Do not report security vulnerabilities publicly; use the private security advisory link instead.
  - type: input
    id: summary
    attributes:
      label: Short summary
      description: One sentence describing the user-visible failure.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Setup and game detection
        - Discover and providers
        - Collection and imports
        - Profiles and deployment
        - Server downloads
        - Activity and packaging
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version or commit
      placeholder: 0.1.0 or abc1234
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the smallest fixture, archive shape, or provider response that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove usernames, absolute paths, tokens, and private mod content before posting.
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: This is not a security vulnerability.
          required: true
