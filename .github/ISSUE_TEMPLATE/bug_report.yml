name: Bug report
description: Report a reproducible problem with the mod manager
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Include the app version, operating system, game installation source, and a minimal reproduction. Never attach private paths or proprietary mod files without removing sensitive information.
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
